<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="description" content="Identity and Governance Administration lab resources." />
        <title>Identity and Governance Administration Lab | JBCybersec</title>
        <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
        <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
        <link href="https://fonts.googleapis.com/css?family=Varela+Round" rel="stylesheet" />
        <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet" />
        <link href="css/styles.css" rel="stylesheet" />
        <style>
            body.iga-page {
                min-height: 100vh;
                color: #fff;
                background: url("assets/img/img3.png") center / cover fixed no-repeat;
            }

            .iga-content {
                min-height: 100vh;
                padding: 8rem 0 4rem;
            }

            .iga-title {
                max-width: 60rem;
                margin: 0 auto 3rem;
                font-family: "Varela Round", sans-serif;
                font-size: clamp(2rem, 5vw, 4rem);
                letter-spacing: 0.2rem;
                text-transform: uppercase;
            }

            .iga-document-grid {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 1rem;
                max-width: 48rem;
                margin: 0 auto;
            }

            .iga-document-link {
                display: flex;
                min-height: 15rem;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 1.25rem;
                padding: 1.5rem;
                color: #fff;
                text-align: center;
                text-decoration: none;
                transition: transform 0.2s ease;
            }

            .iga-document-link:hover,
            .iga-document-link:focus-visible {
                color: #fff;
                transform: translateY(-0.4rem);
            }

            .iga-document-link:focus-visible {
                outline: 0.2rem solid #fff;
                outline-offset: 0.25rem;
            }

            .iga-document-icon {
                color: #64a19d;
                font-size: clamp(4rem, 11vw, 7rem);
            }

            .iga-document-name {
                font-family: "Varela Round", sans-serif;
                font-size: clamp(1rem, 2vw, 1.25rem);
                letter-spacing: 0.14rem;
                text-transform: uppercase;
            }

            @media (max-width: 575.98px) {
                .iga-document-grid {
                    grid-template-columns: 1fr;
                    max-width: 22rem;
                }

                .iga-document-link {
                    min-height: 12rem;
                }
            }
        </style>
    </head>
    <body class="iga-page" id="page-top">
        <nav class="navbar navbar-expand-lg navbar-light fixed-top" id="mainNav">
            <div class="container px-4 px-lg-5">
                <a class="navbar-brand" href="index.html">jbcybersec.com</a>
                <a class="nav-link ms-auto" href="index.html#projects">Projects</a>
            </div>
        </nav>
        <main class="iga-content">
            <div class="container px-4 px-lg-5">
                <h1 class="iga-title text-center">Identity and Governance Administration Lab</h1>
                <div class="iga-document-grid">
                    <a class="iga-document-link" href="assets/IGA-Infrastructure-and-Connector.pdf" target="_blank" rel="noopener noreferrer" aria-label="Open IGA Infrastructure and Connector Configuration PDF in a new tab">
                        <i class="iga-document-icon fa-solid fa-server" aria-hidden="true"></i>
                        <span class="iga-document-name">IGA Infrastructure and Connector Configuration</span>
                    </a>
                    <a class="iga-document-link" href="assets/IGA-Joiner-Workflow.pdf" target="_blank" rel="noopener noreferrer" aria-label="Open IGA Joiner Workflow PDF in a new tab">
                        <i class="iga-document-icon fa-solid fa-user-plus" aria-hidden="true"></i>
                        <span class="iga-document-name">IGA Joiner Workflow</span>
                    </a>
                </div>
            </div>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/scripts.js"></script>
    </body>
</html>
